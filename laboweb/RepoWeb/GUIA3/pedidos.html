<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos | Panadería Santa Rosa</title>
    <link rel="stylesheet" href="css/estilos.css">
    <script src="js/app.js" defer></script>
</head>

<body>
    <header class="site-header">
        <h1 style="text-align: center;">Panadería Santa Rosa</h1>
        <nav class="site-nav">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="index.html#productos">Productos</a></li>
                <li><a href="pedidos.html">Pedidos</a></li>
                <li><a href="index.html#contacto">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Hacer un pedido</h2>
            <form action="#" novalidate>
                
                <div class="campo-grupo">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" name="nombre" required aria-describedby="error-nombre">
                    <p class="error" id="error-nombre"></p>
                </div>

                <div class="campo-grupo">
                    <label for="celular">Celular</label>
                    <input type="tel" id="celular" name="celular" required aria-describedby="error-celular">
                    <p class="error" id="error-celular"></p>
                </div>

                <div class="campo-grupo">
                    <label for="producto">Producto</label>
                    <select id="producto" name="producto" required aria-describedby="error-producto">
                        <option value="">Selecciona...</option>
                        <option value="Pan de yema">Pan de yema</option>
                        <option value="Pan chancay">Pan chancay</option>
                        <option value="Triples">Triples</option>
                        <option value="Torta de chocolate">Torta de chocolate</option>
                    </select>
                    <p class="error" id="error-producto"></p>
                </div>

                <div class="campo-grupo">
                    <label for="cantidad">Cantidad</label>
                    <input type="number" id="cantidad" name="cantidad" value="1" required aria-describedby="error-cantidad">
                    <p class="error" id="error-cantidad"></p>
                </div>

                <div class="campo-grupo">
                    <label for="fecha">Fecha de recojo</label>
                    <input type="date" id="fecha" name="fecha" required aria-describedby="error-fecha">
                    <p class="error" id="error-fecha"></p>
                </div>

                <div class="campo-grupo">
                    <label>
                        <input type="checkbox" id="consentimiento" name="consentimiento" aria-describedby="error-consentimiento"> Acepto los términos y condiciones
                    </label>
                    <p class="error" id="error-consentimiento"></p>
                </div>

                <div id="estado" role="status"></div>
                
                <button type="submit">Enviar pedido</button>
            </form>
        </section>
    </main>

    <footer id="contacto" class="site-footer">
        <h2>Visítanos</h2>
        <address>
            Av. Los Panaderos 123, Lima<br>
            Celular: <a href="tel:+51900000000">900 000 000</a>
        </address>
        <p>Lunes a sábado de 6:00 a 20:00 · Domingos de 6:00 a 13:00</p>
    </footer>

    <a href="../../index.html" class="btn-volver-lab">← Volver al Laboratorio</a>
</body>
</html>
